<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Currency Exchanger</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Live Currency Exchanger</h1>
      </header>

    <!-- 1. Functional Requirements -->
      <div class="input-row">
        <!-- Enter an amount to convert -->
        <!-- Handle invalid inputs gracefully (e.g., empty fields or non-numeric values).  -->
        <input type="number" id="amount" min="0" />
        <!-- Select a source currency (the currency they have).  -->
        <!-- Include at least 10 different currencies for selection.  -->
        <select id="fromCurrency" class="currency-select">
          <option value="USD">United State Dollar</option>
          <option value="EUR">Euro</option>
          <option value="INR">Indian Rupee</option>
          <option value="AUD">Australian Dollar</option>
          <option value="CAD">Canadian Dollar</option>
          <option value="PKR">Pakistani Rupee</option>
          <option value="CNY">Chinese Yuan</option>
          <option value="JPY">Japanese Yen</option>
          <option value="GBP">British Pound</option>
          <option value="CHF">Swiss Franc</option>
        </select>
      </div>

      <div class="input-row">
        <div class="result">
          <p id="result"></p>
        </div>
        <!-- Select a target currency (the currency they want to convert to).  -->
        <select id="toCurrency" class="currency-select">
          <option value="USD">United State Dollar</option>
          <option value="EUR">Euro</option>
          <option value="INR">Indian Rupee</option>
          <option value="AUD">Australian Dollar</option>
          <option value="CAD">Canadian Dollar</option>
          <option value="PKR">Pakistani Rupee</option>
          <option value="CNY">Chinese Yuan</option>
          <option value="JPY">Japanese Yen</option>
          <option value="GBP">British Pound</option>
          <option value="CHF">Swiss Franc</option>
        </select>
      </div>
      <!-- Additional Features -->
      <div style="display: flex; justify-content: center; gap: 10px;">
        <button id="copyResultbutton">Copy Result</button>
        <button id="clearFieldsbutton">Clear</button>
      </div>
          <br/>
      <div class="end">
        <span>Thanks!</span>
      </div>
 
    <script src="./assets/js/script.js"></script>
  </body>
</html>
</div>
